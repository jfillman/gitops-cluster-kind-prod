# Direct adaptation of gitops-cluster-dev/02-argocd-apps/tenant-onboarding/
# applicationset.yaml - same two-source Application shape (§5 of gitops-
# strategy.md), pointed at this cluster's own tenants repo, with cluster: kind-prod
# hardcoded here (matching the SAME pattern that file uses for kind-dev - each
# cluster's own ApplicationSet hardcodes its own name, ApplicationEnvironment's
# spec.cluster field just has to match whichever cluster's ApplicationSet it's
# targeting). See that file's own header for the full design rationale, unchanged
# here.
#
# namespace: argocd-apps (moved 2026-08-18, was argocd) - argocd-platform/argocd-apps
# split, mirroring kind-dev's. See tenant-appprojects/applicationset.yaml's own header
# for why the cross-namespace write from the platform instance's root is safe.
#
# templatePatch (added 2026-08-18): optional 3rd source, a Kustomize
# configMapGenerator for apps with many config files - opt-in via a
# `configMapGenerator: true` field on the per-env identity.yaml. See kind-dev's own
# version of this file for the full mechanism rationale (why this can't be a plain
# `{{ if }}` block inside spec.template.spec.sources, the StrategicMergePatch/`{}`
# no-op reasoning, the hasKey guard) - unchanged here beyond substituting kind-prod
# throughout.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-onboarding
  namespace: argocd-apps
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: tenant-onboarding
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-kind-prod-tenants.git
        revision: main
        files:
          - path: "tenants/*/*/identity.yaml"
  template:
    metadata:
      name: "{{.appName}}-{{.env}}"
      labels:
        platform.io/component: cluster-config
        platform.io/subcomponent: tenant-onboarding
        platform.io/app: "{{.appName}}"
        platform.io/env: "{{.env}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd-apps
    spec:
      project: "{{.appName}}"
      sources:
        - repoURL: https://github.com/jfillman/idp-service-catalog.git
          targetRevision: v0.3.27
          path: charts/idp-application
          helm:
            valuesObject:
              appName: "{{.appName}}"
              cluster: kind-prod
              envName: "{{.env}}"
            valueFiles:
              - $appsrc/kind-prod/{{.env}}/values.yaml
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          ref: appsrc
          directory:
            exclude: "*"
      destination:
        server: https://kubernetes.default.svc
        namespace: "app-{{.appName}}-{{.env}}"
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Lets the registry-credentials ClusterExternalSecret
        # (10-crds-operators/external-secrets/registry-credentials-cluster-external-
        # secret.yaml) select this namespace automatically - mirrors platform-cicd's
        # own tenant-onboarding-applicationset.yaml on kind-dev. Re-applied every sync
        # (only takes effect alongside CreateNamespace=true), so it also lands on
        # already-existing namespaces.
        managedNamespaceMetadata:
          labels:
            platform.io/managed-secrets: "true"
  templatePatch: |
    {{- if hasKey . "configMapGenerator" }}
    {{- if .configMapGenerator }}
    spec:
      sources:
        - repoURL: https://github.com/jfillman/idp-service-catalog.git
          targetRevision: v0.3.27
          path: charts/idp-application
          helm:
            valuesObject:
              appName: "{{.appName}}"
              cluster: kind-prod
              envName: "{{.env}}"
            valueFiles:
              - $appsrc/kind-prod/{{.env}}/values.yaml
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          ref: appsrc
          directory:
            exclude: "*"
        - repoURL: "{{.gitopsRepoUrl}}"
          targetRevision: main
          path: kind-prod/{{.env}}/configmap
    {{- else }}
    {}
    {{- end }}
    {{- else }}
    {}
    {{- end }}
