# Mirrors gitops-cluster-dev's own xr-requests/applicationset.yaml, with one real,
# deliberate divergence (see destination.namespace below) - not otherwise: same
# directories generator, same anti-circularity reasoning. This cluster's own
# tenants repo (gitops-cluster-kind-prod-tenants) only ever receives SecretStore XR
# manifests here (ApplicationEnvironment's own Composition writes them, alongside
# the app.yaml/identity.yaml it already writes there) - NodeJSApplication/
# ApplicationEnvironment themselves are never created on this cluster
# (Bootstrap-tier stays dev-only permanently), so this ApplicationSet will only
# ever actually see xr-requests/secretstore*.yaml files in practice, even though
# nothing here is SecretStore-specific mechanically - the AppProject's own
# namespaceResourceWhitelist (appproject.yaml, same directory) is what actually
# narrows it, not this generator.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: xr-requests
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: xr-requests
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=invalid"]
  generators:
    - git:
        repoURL: https://github.com/jfillman/gitops-cluster-kind-prod-tenants.git
        revision: main
        directories:
          - path: "tenants/*"
  template:
    metadata:
      name: "{{.path.basename}}-xr-requests"
      labels:
        platform.io/component: cluster-config
        platform.io/subcomponent: xr-requests
        platform.io/app: "{{.path.basename}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      namespace: argocd
    spec:
      project: idp-onboarding
      source:
        repoURL: https://github.com/jfillman/gitops-cluster-kind-prod-tenants.git
        targetRevision: main
        path: "tenants/{{.path.basename}}"
        directory:
          recurse: true
          include: "xr-requests/*.yaml"
      destination:
        server: https://kubernetes.default.svc
        # app-<app>-xrs, NOT app-<app>-cicd like kind-dev's copy - real divergence.
        # kind-dev's -cicd is accurate there (the real CICD control plane also
        # lives there); nothing CICD-related runs on this cluster, so reusing that
        # name would falsely imply it does. -xrs (user-suggested, 2026-08-18)
        # names what's actually here and generalizes to any future XR kind this
        # mechanism ever carries here, not just SecretStore.
        namespace: "app-{{.path.basename}}-xrs"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=background
