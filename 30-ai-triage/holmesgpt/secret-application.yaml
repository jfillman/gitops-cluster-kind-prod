# Same split as ../../40-observability/minio/{application.yaml,secret-application.yaml}:
# a directory-sourced plain manifest (the ExternalSecret in this same folder) that
# isn't part of any Helm chart's own templates, via a directory source excluding this
# Application object itself so ArgoCD doesn't try to interpret it as a plain resource.
#
# Without this, the argocd-platform instance has NO GitHub repository credential of
# its own - argocd-cm's repository.credentials/repositories are both empty, and no
# argocd.argoproj.io/secret-type: repo-creds Secret exists. Every onboarded app's own
# CICD Application sources one of its two `sources` directly from that app's own src
# repo (to read cicd.yaml as a Helm values file), which fails with "authentication
# required: Repository not found" the moment that repo is private -
# NodeJSApplication's own schema defaults visibility: private, so this is not an edge
# case, it is the default path. Ported from gitops-cluster-dev/gitops-cluster-kind-man
# (found live against gitops-cluster-kind-man on 2026-08-25) so this cluster carries
# the same fix.
#
# GitHub App auth (githubAppID/githubAppInstallationID/githubAppPrivateKey), not a PAT -
# reuses the SAME App this platform's own token-review-interceptor already uses
# (platform-system/github-app-creds, itself ESO-synced from Infisical) rather than
# minting or storing a second credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: holmesgpt-creds
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: ai-triage
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-kind-prod.git
    targetRevision: main
    path: 30-ai-triage/holmesgpt
    directory:
      exclude: "{application.yaml,secret-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
