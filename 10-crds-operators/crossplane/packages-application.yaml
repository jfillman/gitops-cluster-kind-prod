# Separate from application.yaml (the Crossplane Helm chart itself) - same pattern
# as gitops-cluster-dev/10-crds-operators/crossplane/packages-application.yaml.
# Directory source pointed at this same folder, excluding the Application objects
# themselves so ArgoCD doesn't try to interpret them as plain resources to apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-packages
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-kind-prod.git
    targetRevision: main
    path: 10-crds-operators/crossplane
    directory:
      exclude: "{application.yaml,packages-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
