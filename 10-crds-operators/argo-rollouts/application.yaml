# Vendored, pinned manifest (install.yaml in this directory,
# https://github.com/argoproj/argo-rollouts/releases/download/v1.9.1/install.yaml) -
# direct copy of gitops-cluster-dev/10-crds-operators/argo-rollouts/install.yaml,
# same version (v1.9.1), kept identical rather than re-fetched independently. Added
# 2026-08-18 - this cluster never had Argo Rollouts installed at all (confirmed live:
# no `rollouts.argoproj.io` CRD, no `argo-rollouts` namespace), even though
# `idp-application` uses `Rollout` as its default workload resource and
# `checkout-api-prod`'s own `values.yaml` already carries a `rollout:` block - any real
# Rollout manifest that DID sync here would have sat as an inert, uncontrolled CR with
# zero controller to reconcile it. Directory source, same as crossplane-packages/ (a
# raw-manifest install, not a Helm chart).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: crds-operators
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-kind-prod.git
    targetRevision: main
    path: 10-crds-operators/argo-rollouts
    directory:
      exclude: "{application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Same annotation-size limit hit on ArgoCD's/external-secrets'/
      # kube-prometheus-stack's own CRDs (01-argocd-platform/README.md) - Argo Rollouts'
      # CRDs (Rollout, AnalysisTemplate, AnalysisRun, Experiment,
      # ClusterAnalysisTemplate) are large enough to hit it too.
      - ServerSideApply=true
