# Same shape as platform-cicd's own control-plane ClusterSecretStore
# (platform-cicd/charts/platform-cicd-control-plane/templates/secretstore/
# cluster-secret-store.yaml) - deliberately same names (platform-secret-store /
# platform-secrets) so idp-application's registryCredentials/secrets: mechanisms
# (which hardcode platform-secret-store as their default secretStoreRef) work
# identically on kind-prod with zero app-side value changes, not a per-cluster
# rename. kind-prod has no platform-cicd control-plane instance of its own to bundle
# this into, so it's a standalone pair of manifests here instead of a Helm chart's
# templates/ - same content, different delivery mechanism.
#
# ESO's own `kubernetes` provider - mirrors real Secrets from this ONE dedicated,
# narrowly-scoped source namespace, on THIS cluster. The user alone writes real
# Secret material into `platform-secrets` via `kubectl create secret`, same
# "manual by design" convention as every other credential in this platform - nothing
# here or in git ever holds a real secret value.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-secrets
  labels:
    platform.io/subcomponent: "secretstore"
    platform.io/purpose: eso-kubernetes-provider-source
---
# ESO's own controller ServiceAccount (external-secrets/external-secrets, installed by
# the sibling application.yaml in this directory) already carries a ClusterRole with
# get/list/watch on Secrets cluster-wide (confirmed live on kind-dev - see that
# ClusterSecretStore's own header) - no new RBAC needed here, scoping is via this
# object's own spec.provider.kubernetes.remoteNamespace, not a fresh grant.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secret-store
  labels:
    platform.io/subcomponent: "secretstore"
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: platform-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
