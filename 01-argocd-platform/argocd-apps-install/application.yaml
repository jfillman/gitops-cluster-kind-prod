# gitops-strategy.md §2/§4: the app-owner-facing ArgoCD instance, installed and owned
# by argocd-platform (this Application lives in argocd-platform's own `argocd`
# namespace - it's the installer, not the thing being installed). Direct mirror of
# gitops-cluster-dev/01-argocd-platform/argocd-apps-install/application.yaml - same
# split, same reasoning (see that file's own header for the full "why"), applied here
# 2026-08-18 to close the gap this cluster had vs. kind-dev: everything app-facing
# (tenant onboarding, xr-requests, per-app AppProjects) was still running on the same
# single instance as cluster-config, unlike kind-dev's already-split setup.
#
# Chart version 10.3.2 (appVersion v3.5.0) matches THIS cluster's own platform
# instance exactly (01-argocd-platform/install.yaml's own pin) - same reasoning
# gitops-cluster-dev's copy documents (shared CRDs, avoid controller/CRD-schema skew
# between the two instances on one cluster), just a different version number since
# kind-prod's platform instance was never pinned to kind-dev's v3.4.5.
#
# crds.install: false - the CRDs are already cluster-wide from 01-argocd-platform's
# own install.yaml; a second Helm-managed CRD install would fight over ownership of
# the same CustomResourceDefinition objects.
#
# configs.cm carries the same Rollout + Crossplane XR (catalog.idp.io/*) health-check
# customizations 01-argocd-platform/install.yaml's own argocd-cm has - this is the
# instance that actually owns the xr-requests-generated Applications wrapping each
# app's SecretStore XRs and the tenant-onboarding-generated Application wrapping
# checkout-api's real Rollout, so it's the argocd-cm that needs these, not (only) the
# platform instance's.
#
# No application.namespaces / cross-namespace watch configured, deliberately, on
# either instance - same stock-default isolation gitops-cluster-dev's own split
# relies on (confirmed live there). No `*-cicd` namespace widening here either -
# that was specifically for platform-cicd's ephemeral-PR-env ApplicationSet on
# kind-dev, which has no equivalent on this cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps-install
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: argocd-apps
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.3.2
    helm:
      releaseName: argocd-apps
      valuesObject:
        crds:
          install: false
        dex:
          enabled: false
        configs:
          # Added 2026-09-02: the kiac Gateway only has an HTTP/80 listener, no TLS
          # termination in front of this Service - argocd-server's stock default (TLS
          # on, HTTP redirected to HTTPS) meant argocd-apps-ui's HTTPRoute just got a
          # 307 back to a https:// URL the Gateway can't serve. Mirrors
          # gitops-cluster-dev's own copy of this file; also applied to
          # 01-argocd-platform/install.yaml's own argocd-cmd-params-cm.
          params:
            server.insecure: "true"
            # 2026-09-05: ArgoCD's git-files generator defaults to "greedy" globbing -
            # a single `*` in files.path crosses directory separators unless this flag
            # is set (see Generators-Git-File-Globbing docs). tenant-appprojects' own
            # `tenants/*/identity.yaml` pattern was matching not just the 4 top-level
            # tenant identity.yaml files it's meant for, but also the 5 newer per-env
            # tenants/<app>/<env>/identity.yaml files (flat schema, no platformIdentity
            # wrapper) that ApplicationEnvironment's writer produces - all 5 rendered
            # `.platformIdentity.appName` as <no value>, collided on name, and the
            # ApplicationSet went permanently Degraded (failing every 3-min poll, not a
            # one-off/stale error). tenant-onboarding's own `tenants/*/*/identity.yaml`
            # and xr-requests' directory generator already assume non-greedy semantics,
            # so this instance-wide flag shouldn't change their behavior.
            applicationsetcontroller.enable.new.git.file.globbing: "true"
          cm:
            # Backstage's ArgoCD plugin (idp/docs/backstage-design.md plugin #1):
            # a dedicated local account, `apiKey` capability only (no `login` -
            # can't be used to sign into the UI/CLI with a password, only to hold
            # API tokens minted for it). Bound to the built-in `role:readonly` via
            # configs.rbac below. Token itself is never in git - see
            # gitops-cluster-dev's own copy of this file for the full rationale;
            # mirrored here, each instance needs its own account + token, same as
            # argocd-repo-creds-jfillman already needed per-instance registration.
            accounts.backstage: apiKey
            resource.customizations.health.argoproj.io_Rollout: |
              function checkReplicasStatus(obj)
                local hs = {}
                local desiredReplicas = getNumberValueOrDefault(obj.spec.replicas, 1)
                statusReplicas = getNumberValueOrDefault(obj.status.replicas, 0)
                updatedReplicas = getNumberValueOrDefault(obj.status.updatedReplicas, 0)
                local availableReplicas = getNumberValueOrDefault(obj.status.availableReplicas, 0)

                if updatedReplicas < desiredReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: More replicas need to be updated"
                  return hs
                end
                if availableReplicas < updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: updated replicas are still becoming available"
                  return hs
                end
                return nil
              end

              function getStableRS(obj)
                if obj.status.stableRS ~= nil then
                  return obj.status.stableRS
                end
                if obj.status.canary ~= nil then
                    return obj.status.canary.stableRS
                end
                return ""
              end

              function getNumberValueOrDefault(field, default)
                if field ~= nil then
                  return field
                end
                return default
              end

              function checkPaused(obj)
                local hs = {}
                hs.status = "Suspended"
                hs.message = "Rollout is paused"
                if obj.status.pauseConditions ~= nil and table.getn(obj.status.pauseConditions) > 0 then
                  return hs
                end

                if obj.spec.paused ~= nil and obj.spec.paused then
                  return hs
                end
                return nil
              end

              function isGenerationObserved(obj)
                if obj.status == nil then
                  return false
                end
                observedGeneration = tonumber(obj.status.observedGeneration)
                if observedGeneration == nil or observedGeneration > obj.metadata.generation then
                  return true
                end
                return observedGeneration == obj.metadata.generation
              end

              function isWorkloadGenerationObserved(obj)
                if obj.spec.workloadRef == nil or obj.metadata.annotations == nil then
                  return true
                end
                local workloadGen = tonumber(obj.metadata.annotations["rollout.argoproj.io/workload-generation"])
                local observedWorkloadGen = tonumber(obj.status.workloadObservedGeneration)
                return workloadGen == observedWorkloadGen
              end

              local hs = {}
              if not isGenerationObserved(obj) or not isWorkloadGenerationObserved(obj) then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout spec update to be observed"
                return hs
              end

              if obj.status.phase ~= nil then
                if obj.status.phase == "Paused" then
                  hs.status = "Suspended"
                else
                  hs.status = obj.status.phase
                end
                hs.message = obj.status.message
                return hs
              end

              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "InvalidSpec" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "RolloutAborted" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
                if condition.type == "Progressing" and condition.reason == "ProgressDeadlineExceeded" then
                  hs.status = "Degraded"
                  hs.message = condition.message
                  return hs
                end
              end

              local isPaused = checkPaused(obj)
              if isPaused ~= nil then
                return isPaused
              end

              if obj.status.currentPodHash == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for rollout to finish: status has not been reconciled."
                return hs
              end

              replicasHS = checkReplicasStatus(obj)
              if replicasHS ~= nil then
                return replicasHS
              end

              local stableRS = getStableRS(obj)

              if obj.spec.strategy.blueGreen ~= nil then
                if obj.status.blueGreen == nil or obj.status.blueGreen.activeSelector ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "active service cutover pending"
                  return hs
                end
                if stableRS ~= "" and stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "waiting for analysis to complete"
                  return hs
                end
              elseif obj.spec.strategy.canary ~= nil then
                if statusReplicas > updatedReplicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for roll out to finish: old replicas are pending termination"
                  return hs
                end
                if stableRS == "" or stableRS ~= obj.status.currentPodHash then
                  hs.status = "Progressing"
                  hs.message = "Waiting for rollout to finish steps"
                  return hs
                end
              end

              hs.status = "Healthy"
              hs.message = ""
              return hs
            resource.customizations: |
              catalog.idp.io/*:
                health.lua: |
                  health_status = {}
                  if obj.status == nil or obj.status.conditions == nil then
                    health_status.status = "Progressing"
                    health_status.message = "Waiting for status.conditions to be reported"
                    return health_status
                  end
                  local synced = nil
                  local ready = nil
                  for _, condition in ipairs(obj.status.conditions) do
                    if condition.type == "Synced" then
                      synced = condition
                    elseif condition.type == "Ready" then
                      ready = condition
                    end
                  end
                  if synced ~= nil and synced.status == "False" then
                    health_status.status = "Degraded"
                    health_status.message = synced.message or synced.reason or "Not synced"
                    return health_status
                  end
                  if ready ~= nil then
                    if ready.status == "True" then
                      health_status.status = "Healthy"
                      health_status.message = ready.message or ready.reason or "Ready"
                    else
                      health_status.status = "Progressing"
                      health_status.message = ready.message or ready.reason or "Not ready"
                    end
                    return health_status
                  end
                  health_status.status = "Progressing"
                  health_status.message = "No Ready condition yet"
                  return health_status
          rbac:
            # Binds the `backstage` account above to ArgoCD's own built-in
            # read-only role - get/list on every resource in every project, no
            # write verbs. Mirrors gitops-cluster-dev's own copy of this file.
            policy.csv: |
              g, backstage, role:readonly
        server:
          # Argo Rollouts UI extension: renders the canary/blue-green step timeline
          # inside an Application's resource tree in the web UI. v0.4.0 (not v0.3.7,
          # which gitops-cluster-dev/gitops-cluster-template pin) because this instance
          # runs chart 10.3.2 / appVersion v3.5.0, whose UI is on React 19 - v0.4.0 is
          # the first release that externalizes react-dom/react for React 19
          # compatibility; v0.3.x targets the React 18 UI those older instances run.
          extensions:
            enabled: true
            extensionList:
              - name: rollout-extension
                env:
                  - name: EXTENSION_URL
                    value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
