# Identical shape to gitops-cluster-dev's own
# 00-bootstrap/backstage-ingestor-rbac/rbac.yaml - see that file's header for the full
# rationale.
apiVersion: v1
kind: Namespace
metadata:
  name: backstage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-ingestor
  namespace: backstage-system
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-ingestor-token
  namespace: backstage-system
  annotations:
    kubernetes.io/service-account.name: backstage-ingestor
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-crd-viewer
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crd-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-crd-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-crossplane-browse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-browse
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Argo Rollouts visualization (2026-09-04, redhat-argocd plugin's Rollouts
# feature - app-config.yaml's kubernetes.customResources in the backstage repo).
# Identical shape to gitops-cluster-dev's own copy - see that file's header for
# the full rationale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-argo-rollouts-viewer
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-argo-rollouts-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-argo-rollouts-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage-system
---
# Gateway API (2026-09-06, Glidepath's Config-tab route URL - app-config.yaml's
# kubernetes.customResources in the backstage repo). Identical shape to
# gitops-cluster-dev's own copy - see that file's header for the full
# rationale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-gateway-api-viewer
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list", "watch"]
---
# namespace: backstage, not backstage-system as this file's own Namespace/
# ServiceAccount/Secret objects above declare - confirmed live (2026-09-06)
# that Backstage's real, in-use ServiceAccount on this cluster is
# system:serviceaccount:backstage:backstage-ingestor (Backstage runs
# in-cluster here, `kubectl get deploy backstage -n backstage -o
# jsonpath='{.spec.template.spec.serviceAccountName}'`), and that the other
# four ClusterRoleBindings below (view/crd-viewer/crossplane-browse/
# argo-rollouts-viewer) already have live `subjects[].namespace: backstage`
# despite this file's own text still saying backstage-system - drift from
# some earlier out-of-band fix this file was never updated to match. This
# binding was live-patched to backstage the same way, and written here
# matching that reality rather than the file's stale backstage-system,
# rather than perpetuating the mismatch on a fifth binding. The
# broader backstage-system-vs-backstage drift (this file's Namespace/
# ServiceAccount/Secret objects, and the other four bindings' own text)
# is real and pre-existing, not introduced or fully resolved here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-gateway-api-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-gateway-api-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage
---
# Tower's Topology tab "all resources" gallery (2026-09-17) - RBAC objects
# (Roles/RoleBindings/ClusterRoles/ClusterRoleBindings) are deliberately
# excluded from the `view` ClusterRole's own aggregation (Kubernetes never
# lets `view`/`edit` see who-can-do-what by default, for the same reason it
# excludes Secret data), so a dedicated grant is the only way to surface
# them, same reasoning as every other CRD-shaped exception in this file.
# ClusterRole/ClusterRoleBinding added alongside the namespaced pair
# (2026-09-17, same day) once the gallery's RBAC view started resolving a
# RoleBinding's roleRef to its actual rules - that reference is very
# commonly a ClusterRole (bound just within one namespace via a
# RoleBinding), so resolving it needs read access to ClusterRoles too, not
# just Roles. Read-only, no different in spirit from the `view` binding
# this identity already has for every other resource kind - this only adds
# visibility into RBAC *configuration* (which subjects a binding names,
# which rules a Role/ClusterRole grants), never lets this identity exercise
# those grants itself. Identical shape to gitops-cluster-dev's own copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-rbac-viewer
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-rbac-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-rbac-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    # Real, not backstage-system - see this file's own comment above
    # gateway-api-viewer's binding for why a new grant here is written
    # matching the live-correct value rather than the file's older drift.
    namespace: backstage
---
# Same Topology-tab resource gallery, the two CRD kinds it also wants:
# ExternalSecret (external-secrets.io - this platform's Infisical-backed
# secret sync, see infisical-secretstore-operator) and ServiceMonitor
# (monitoring.coreos.com - what wires an app's metrics into
# kube-prometheus-stack). Neither group is covered by `view` or any
# existing grant here, same reasoning as backstage-argo-rollouts-viewer/
# backstage-gateway-api-viewer above - grouped into one ClusterRole since
# both were added for the same feature, rather than two more separate
# ClusterRole/ClusterRoleBinding pairs. Identical shape to
# gitops-cluster-dev's own copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-topology-resource-viewer
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-ingestor-topology-resource-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-topology-resource-viewer
subjects:
  - kind: ServiceAccount
    name: backstage-ingestor
    namespace: backstage
