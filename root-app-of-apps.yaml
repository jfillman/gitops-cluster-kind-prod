# The one resource applied manually, once - same bootstrap pattern
# gitops-cluster-dev/root-app-of-apps.yaml already establishes.
#
# STALE HISTORY, corrected 2026-08-18: this comment used to say ArgoCD itself is NOT
# bootstrapped here, reusing a live instance predating this repo (platform-cicd's own
# staging pipeline). That instance was deliberately deleted 2026-08-18 proving this
# repo's own disaster-recovery story for real - see 01-argocd-platform/README.md's
# "self-contained as of 2026-08-18" section. This cluster ALSO now has the
# argocd-platform/argocd-apps split kind-dev has (01-argocd-platform/README.md's own
# split section) - single-instance is no longer accurate either. platform-cicd's old
# cicd-flow-test-app-cluster-root/-staging Applications did not survive the rebuild -
# never git-tracked anywhere, so nothing could reproduce them.
#
# **/secret-application.yaml added 2026-08-18 alongside 40-observability/minio/ - same
# pattern gitops-cluster-dev's own root already uses, this repo's glob just hadn't
# needed it until now.
#
# REMINDER (same gotcha gitops-cluster-dev's own root already documents): this
# Application's own .spec does NOT self-update from git - after editing this glob,
# gitops-cluster-kind-prod-root itself needs a manual hard-refresh before its newly-
# includable children get discovered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-cluster-kind-prod-root
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: app-of-apps
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/gitops-cluster-kind-prod.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: "{**/application.yaml,**/packages-application.yaml,**/applicationset.yaml,**/secret-application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
