# Delivers kind-dev's backstage-ingestor ServiceAccount token (minted by
# gitops-cluster-dev/00-bootstrap/backstage-ingestor-rbac/, see that directory's README
# for the manual retrieval + Infisical-planting steps) into a K8s Secret here, which
# deployment.yaml mounts as KIND_DEV_SA_TOKEN for app-config.yaml's
# kubernetes.clusterLocatorMethods to read via ${KIND_DEV_SA_TOKEN} substitution.
# Same secretStoreRef (platform-secret-store) and "manual by design" posture as
# github-oauth-secret.yaml in this same directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-kind-dev-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: backstage-kind-dev-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: backstage-kind-dev-sa-token
