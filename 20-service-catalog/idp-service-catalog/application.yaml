# Pins idp-service-catalog to the same tag gitops-cluster-dev uses but,
# unlike that repo's own Application, deliberately SCOPED here - see
# idp/docs/service-catalog-design.md §0 "Where Crossplane runs across a multi-
# cluster fleet". Explicit file list, not a wildcard. NodeJSApplication/
# ApplicationEnvironment stay dev-only (Bootstrap-tier centralizes permanently,
# regardless of fleet size - they're pure provider-github writers, no locality
# requirement at all), so they're deliberately excluded here rather than installed
# and simply unused.
#
# SecretStore added 2026-08-17 (Item 8's multi-cluster revision) - the OPPOSITE
# locality reasoning from NodeJSApplication/ApplicationEnvironment: it composes a
# real ClusterSecretStore (via a wrapped provider-kubernetes Object) directly on
# whichever cluster its own Composition runs on, so - like SLO - it has to be
# installed on every cluster that hosts real app deployments, not centralized on
# kind-dev. Needs its own InfisicalProject/InfisicalEnvironment CRDs too
# (operators/infisical-secretstore-operator/crds/ - not included here, that
# directory isn't a Crossplane XRD/Composition at all; installed on this cluster
# separately, see 10-crds-operators/infisical-secretstore-operator/application.yaml).
#
# RolloutWatch added 2026-08-18 (AI-triage redesign) - same locality reasoning as
# SecretStore: function-rollout-watcher reads the live, Helm-created Rollout via a
# same-cluster extra-resources lookup, so it has to run wherever the app actually
# is, not centralized on kind-dev. See idp-service-catalog's
# functions/function-rollout-watcher/README.md for the mechanism.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-service-catalog
  namespace: argocd
  labels:
    platform.io/component: cluster-config
    platform.io/subcomponent: service-catalog
spec:
  project: default
  source:
    repoURL: https://github.com/jfillman/idp-service-catalog.git
    # 2026-08-24: bumped from v0.3.34 to v0.3.39. Fixes the SecretStore
    # Composition's hardcoded Infisical NodePort IP - stale at 10.89.0.2 since
    # kind-dev's 2026-08-23/24 rebuild moved the node's real podman-network
    # address to 10.89.0.5, breaking every SecretStore this Composition
    # renders on this cluster (live-verified: `unable to create client` on
    # all 4 kind-prod SecretStore/ClusterSecretStore objects). v0.3.34..
    # v0.3.39 also picks up a real RolloutWatch fix (bf2c658, in scope via
    # this Application's own compositions/rolloutwatch/composition.yaml
    # include) - the rest of the intervening range (NodeJSApplication/
    # ApplicationEnvironment changes) falls outside this Application's
    # explicit include list below and has no effect here.
    # 2026-08-24: bumped from v0.3.39 to v0.3.41 (v0.3.40 is an unrelated
    # idp-application chart tag on this shared repo). The IP flipped back to
    # 10.89.0.2 after a further kind-dev restart - not monotonic, don't
    # assume a higher IP is newer. v0.3.39..v0.3.41's only xrds/compositions/
    # diff is that same IP string, twice.
    # 2026-08-25: bumped from v0.3.41 to v0.3.48. kind-dev's address moved
    # again, 10.89.0.2 -> 10.89.0.3, after the podman machine was stopped and
    # restarted. v0.3.41..v0.3.48's only diff within this Application's
    # include list (slo/secretstore/rolloutwatch) is that same IP string,
    # twice (confirmed via `git diff --stat`) - clean, same bar the prior
    # bumps above used.
    # 2026-08-27: bumped from v0.3.48 to v0.3.49 - annotates the 5 Bootstrap-tier
    # XRDs with terasky.backstage.io/add-to-catalog + target-path for Backstage
    # catalog ingestion (idp/docs/backstage-design.md). No functional change to
    # this Application's own synced XRDs' behavior.
    targetRevision: v0.3.49
    path: .
    directory:
      recurse: true
      include: "{xrds/slo.yaml,compositions/slo/composition.yaml,xrds/secretstore.yaml,compositions/secretstore/composition.yaml,xrds/rolloutwatch.yaml,compositions/rolloutwatch/composition.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
